name: Compilar APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Renombrar
        run: cp app/build/outputs/apk/release/app-release.apk Collerense_Asistencia.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Collerense_Asistencia_APK
          path: Collerense_Asistencia.apk
      - name: Publicar descarga directa
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ultima --yes --cleanup-tag || true
          gh release create ultima Collerense_Asistencia.apk --title "Última versión (compilación ${{ github.run_number }})" --notes "Descarga Collerense_Asistencia.apk e instálala." --latest
